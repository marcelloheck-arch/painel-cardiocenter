<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardiocenter — Confirmações de Consulta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Identidade visual — Plano de Modernização Cardiocenter */
    --azul: #2563EB;
    --azul-escuro: #1E3A5F;
    --cinza-fundo: #F5F7FA;
    --cinza-borda: #E2E8F0;
    --cinza-texto: #64748B;
    --preto: #172033;
    --branco: #FFFFFF;
    --verde: #16A34A;
    --verde-claro: #DCFCE7;
    --amarelo: #F59E0B;
    --amarelo-claro: #FEF3C7;
    --azul-claro: #DBEAFE;
    --roxo: #1E3A5F;
    --roxo-claro: #E2E8F0;
    --vermelho: #DC2626;
    --vermelho-escuro: #B91C1C;
    --vermelho-claro: #FEE2E2;
    --cinza-status: #94A3B8;
    --cinza-status-claro: #F1F5F9;
  }

  body { font-family: 'Inter', sans-serif; background: var(--cinza-fundo); color: var(--preto); min-height: 100vh; }

  header {
    background: var(--branco); border-bottom: 1px solid var(--cinza-borda);
    padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(23,32,51,0.05);
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .coracao-wrap { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .coracao-svg { width: 40px; height: 40px; display: block; }
  .coracao-svg path.corpo { fill: var(--vermelho); }
  .coracao-svg path.pulso {
    fill: none; stroke: #FFFFFF; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 68; stroke-dashoffset: 0;
    animation: bater-pulso 1.8s linear infinite;
  }
  .coracao-svg .corpo { animation: bater-escala 1.8s ease-in-out infinite; transform-origin: 20px 20px; }
  @keyframes bater-pulso { from { stroke-dashoffset: 68; } to { stroke-dashoffset: 0; } }
  @keyframes bater-escala {
    0%, 100% { transform: scale(1); }
    18% { transform: scale(1.09); }
    32% { transform: scale(0.98); }
    46% { transform: scale(1); }
  }
  .logo-texto { font-size: 18px; font-weight: 700; }
  .logo-sub { font-size: 12px; color: var(--cinza-texto); }

  .status-conexao { display: flex; align-items: center; gap: 8px; }
  .status-ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); animation: pulsar-ponto 1.8s ease-in-out infinite; flex-shrink: 0; }
  @keyframes pulsar-ponto {
    0%, 100% { box-shadow: 0 0 0 0 rgba(39,174,96,0.5); }
    50% { box-shadow: 0 0 0 5px rgba(39,174,96,0); }
  }
  .status-texto { font-size: 12px; color: var(--cinza-texto); font-weight: 500; }
  .header-direita { display: flex; align-items: center; gap: 18px; }

  .btn-atualizar {
    background: var(--cinza-fundo); border: 1px solid var(--cinza-borda); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--cinza-texto); cursor: pointer;
  }
  .btn-atualizar:hover { background: var(--cinza-borda); color: var(--preto); }

  .periodo-bar {
    display: flex; align-items: center; gap: 12px; padding: 20px 32px 0; flex-wrap: wrap;
  }
  .periodo-label { font-size: 13px; color: var(--cinza-texto); font-weight: 500; }
  .periodo-btn {
    padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--cinza-borda); background: var(--branco);
    font-size: 13px; font-weight: 500; color: var(--cinza-texto); cursor: pointer;
  }
  .periodo-btn:hover, .periodo-btn.ativo { background: var(--azul); border-color: var(--azul); color: white; }
  .periodo-custom { display: flex; align-items: center; gap: 8px; margin-left: 8px; }
  .periodo-custom input {
    padding: 6px 10px; border: 1.5px solid var(--cinza-borda); border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .periodo-custom-label { font-size: 12px; color: var(--cinza-texto); }

  .contadores {
    display: flex; gap: 14px; padding: 18px 32px 0; flex-wrap: wrap;
  }
  .contador-card {
    background: var(--branco); border-radius: 12px; padding: 14px 18px; border: 1.5px solid var(--cinza-borda);
    display: flex; align-items: center; gap: 12px; min-width: 155px; cursor: pointer; transition: all 0.15s;
  }
  .contador-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.07); }
  .contador-card.ativo { border-color: var(--azul); box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
  .contador-icone { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .contador-icone.confirmado { background: var(--verde-claro); }
  .contador-icone.reagendado { background: var(--roxo-claro); }
  .contador-icone.cancelado { background: var(--vermelho-claro); }
  .contador-icone.nao-respondeu { background: var(--amarelo-claro); }
  .contador-icone.pendente { background: var(--azul-claro); }
  .contador-icone.erro { background: var(--cinza-status-claro); }
  .contador-numero { font-size: 24px; font-weight: 700; line-height: 1; }
  .contador-label { font-size: 11.5px; color: var(--cinza-texto); margin-top: 2px; }

  .barra-controles { display: flex; align-items: center; gap: 12px; padding: 20px 32px 0; flex-wrap: wrap; }

  .filtros { display: flex; gap: 8px; flex-wrap: wrap; flex: 1 1 auto; }
  .filtro-btn {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--cinza-borda); background: var(--branco);
    font-size: 13px; font-weight: 500; color: var(--cinza-texto); cursor: pointer;
  }
  .filtro-btn:hover, .filtro-btn.ativo { background: var(--azul-escuro); border-color: var(--azul-escuro); color: white; }

  .busca-wrap { position: relative; min-width: 220px; }
  .busca-input {
    width: 100%; padding: 9px 14px 9px 34px; border: 1.5px solid var(--cinza-borda); border-radius: 20px;
    font-size: 13px; font-family: inherit; background: var(--branco);
  }
  .busca-input:focus { outline: none; border-color: var(--azul); }
  .busca-icone { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--cinza-texto); pointer-events: none; }

  .ordenacao { display: flex; align-items: center; gap: 6px; }
  .ordenacao-label { font-size: 12px; color: var(--cinza-texto); }
  .ordenacao select {
    padding: 8px 12px; border: 1.5px solid var(--cinza-borda); border-radius: 20px; font-size: 13px;
    font-family: inherit; background: var(--branco); color: var(--preto); cursor: pointer;
  }

  .lista { padding: 16px 32px 32px; display: flex; flex-direction: column; gap: 8px; }

  .linha {
    background: var(--branco); border-radius: 12px; border: 1px solid var(--cinza-borda);
    overflow: hidden; transition: box-shadow 0.15s;
  }
  .linha:hover { box-shadow: 0 2px 10px rgba(23,32,51,0.06); }
  .linha.status-confirmado_paciente { border-left: 4px solid var(--verde); }
  .linha.status-remarcado_paciente { border-left: 4px solid var(--roxo); }
  .linha.status-cancelado_paciente { border-left: 4px solid var(--vermelho); }
  .linha.status-enviado { border-left: 4px solid var(--amarelo); }
  .linha.status-pendente { border-left: 4px solid var(--azul); }
  .linha.status-erro { border-left: 4px solid var(--cinza-status); }

  .linha-cabeca {
    display: grid; grid-template-columns: 1.6fr 1.3fr 1fr auto auto 20px;
    align-items: center; gap: 16px; padding: 12px 16px; cursor: pointer;
  }
  .linha-nome { font-size: 15px; font-weight: 600; }
  .linha-nome-sub { font-size: 11px; color: var(--cinza-texto); font-weight: 500; margin-top: 1px; }
  .linha-telefone { font-size: 13px; color: var(--cinza-texto); }
  .linha-data { font-size: 12.5px; color: var(--cinza-texto); }
  .linha-badges { display: flex; gap: 6px; align-items: center; justify-self: end; }
  .linha-seta { color: var(--cinza-texto); font-size: 12px; transition: transform 0.2s; justify-self: end; }
  .linha.aberta .linha-seta { transform: rotate(90deg); }

  .badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.confirmado_paciente { background: var(--verde-claro); color: #1D6A39; }
  .badge.remarcado_paciente { background: var(--roxo-claro); color: var(--roxo); }
  .badge.cancelado_paciente { background: var(--vermelho-claro); color: var(--vermelho-escuro); }
  .badge.enviado { background: var(--amarelo-claro); color: #7D6608; }
  .badge.pendente { background: var(--azul-claro); color: #1A5276; }
  .badge.erro { background: var(--cinza-status-claro); color: #4D5656; }

  .badge-lembrete { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--azul-escuro); color: white; }

  .linha-corpo { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
  .linha.aberta .linha-corpo { max-height: 400px; }
  .linha-corpo-inner { padding: 4px 16px 16px; border-top: 1px solid var(--cinza-fundo); display: flex; flex-direction: column; gap: 6px; }
  .campo-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; color: var(--cinza-texto); margin-top: 8px; }
  .campo-valor { font-size: 13px; }
  .linha-mensagem { background: var(--cinza-fundo); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--cinza-texto); white-space: pre-wrap; margin-top: 4px; }

  .estado-vazio { text-align: center; padding: 60px 20px; color: var(--cinza-texto); }
  .estado-vazio .icone { font-size: 44px; margin-bottom: 10px; }
  .estado-vazio .titulo { font-size: 15px; font-weight: 600; color: var(--preto); }
  .carregando { text-align: center; padding: 60px; color: var(--cinza-texto); font-size: 14px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--preto); color: white; padding: 12px 20px;
    border-radius: 10px; font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(10px);
    transition: all 0.3s; z-index: 999; pointer-events: none;
  }
  .toast.visivel { opacity: 1; transform: translateY(0); }
  .toast.erro { background: var(--vermelho); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
  .modal-overlay.visivel { display: flex; }
  .modal { background: var(--branco); border-radius: 16px; padding: 28px; width: 340px; }
  .modal-titulo { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--cinza-texto); margin-bottom: 16px; }
  .modal input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--cinza-borda); border-radius: 10px; font-size: 14px; font-family: inherit; margin-bottom: 14px; }
  .modal button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--azul); color: white; font-size: 13px; font-weight: 600; cursor: pointer; }

  @media (max-width: 760px) {
    .linha-cabeca { grid-template-columns: 1fr auto 20px; }
    .linha-telefone, .linha-data { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="coracao-wrap">
      <svg class="coracao-svg" viewBox="0 0 40 40">
        <path class="corpo" d="M20 33.5 C20 33.5 6 24.8 6 15.6 C6 10.4 10 7 14.2 7 C17 7 19 8.6 20 10.6 C21 8.6 23 7 25.8 7 C30 7 34 10.4 34 15.6 C34 24.8 20 33.5 20 33.5 Z"/>
        <path class="pulso" d="M9 20 L14 20 L17 12 L21 27 L24 18 L26.5 20 L31 20"/>
      </svg>
    </div>
    <div>
      <div class="logo-texto">Cardiocenter</div>
      <div class="logo-sub">Confirmações de Consulta</div>
    </div>
  </div>
  <div class="header-direita">
    <div class="status-conexao">
      <div class="status-ponto"></div>
      <div class="status-texto">Sistema conectado</div>
    </div>
    <button class="btn-atualizar" onclick="carregar()">↻ Atualizar</button>
  </div>
</header>

<div class="periodo-bar">
  <span class="periodo-label">Período:</span>
  <button class="periodo-btn ativo" data-periodo="hoje" onclick="selecionarPeriodo('hoje', this)">Hoje</button>
  <button class="periodo-btn" data-periodo="semana" onclick="selecionarPeriodo('semana', this)">Esta semana</button>
  <button class="periodo-btn" data-periodo="mes" onclick="selecionarPeriodo('mes', this)">Este mês</button>
  <button class="periodo-btn" data-periodo="todos" onclick="selecionarPeriodo('todos', this)">Todos</button>
  <div class="periodo-custom">
    <span class="periodo-custom-label">ou de</span>
    <input type="date" id="dataInicio" onchange="selecionarPeriodo('custom')">
    <span class="periodo-custom-label">até</span>
    <input type="date" id="dataFim" onchange="selecionarPeriodo('custom')">
  </div>
</div>

<div class="contadores" id="contadores"></div>

<div class="barra-controles">
  <div class="filtros" id="filtrosStatus">
    <button class="filtro-btn ativo" data-status="todos" onclick="filtrarStatus('todos', this)">Todos</button>
  </div>
  <div class="busca-wrap">
    <span class="busca-icone">🔍</span>
    <input type="text" class="busca-input" id="buscaInput" placeholder="Buscar por nome ou telefone..." oninput="renderizarLista()">
  </div>
  <div class="ordenacao">
    <span class="ordenacao-label">Ordenar:</span>
    <select id="ordenacaoSelect" onchange="renderizarLista()">
      <option value="recente">Mais recentes</option>
      <option value="alfabetica">Nome (A-Z)</option>
      <option value="data_consulta">Data da consulta</option>
    </select>
  </div>
</div>

<div class="lista" id="lista">
  <div class="carregando">Carregando confirmações...</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalToken">
  <div class="modal">
    <div class="modal-titulo">🔒 Código de acesso</div>
    <div class="modal-sub">Digite o código de acesso para continuar.</div>
    <input type="password" id="tokenInput" placeholder="Código de acesso" onkeydown="if(event.key==='Enter')confirmarToken()">
    <button onclick="confirmarToken()">Entrar</button>
  </div>
</div>

<script>
// IMPORTANTE: URL do webhook do Confirmador — ajustar para o endereço real de teste/produção
const WEBHOOK_URL = 'https://coldbloodedchameleon-n8n.cloudfy.live/webhook/painel-confirmacoes-cardiocenter';

// Chave de storage EXCLUSIVA deste painel — nunca reaproveitar a de outro
// painel (lição aprendida em 20/ago: index.html e dashboard.html brigando
// pela mesma chave derrubavam o login um do outro).
const CHAVE_TOKEN = 'cardiocenter_token_acesso_confirmacoes';

function obterToken() { return localStorage.getItem(CHAVE_TOKEN) || ''; }
function mostrarTelaToken() { document.getElementById('modalToken').classList.add('visivel'); }
function confirmarToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) return;
  localStorage.setItem(CHAVE_TOKEN, v);
  document.getElementById('modalToken').classList.remove('visivel');
  carregar();
}

const STATUS_META = {
  confirmado_paciente: { label: 'Confirmados', icone: '✅', classeIcone: 'confirmado' },
  remarcado_paciente:  { label: 'Reagendados', icone: '🔄', classeIcone: 'reagendado' },
  cancelado_paciente:  { label: 'Cancelados',  icone: '❌', classeIcone: 'cancelado' },
  enviado:             { label: 'Não responderam', icone: '⏱️', classeIcone: 'nao-respondeu' },
  pendente:            { label: 'Pendentes',   icone: '📤', classeIcone: 'pendente' },
  erro:                { label: 'Erro',        icone: '⚠️', classeIcone: 'erro' },
};
const ORDEM_STATUS = ['confirmado_paciente', 'remarcado_paciente', 'cancelado_paciente', 'enviado', 'pendente', 'erro'];

let todasConfirmacoes = [];
let statusAtivo = 'todos';
let periodoAtivo = 'hoje';
let linhaAberta = null;

function calcularDatas(periodo) {
  const hoje = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  if (periodo === 'hoje') return { dataInicio: iso(hoje), dataFim: iso(hoje) };
  if (periodo === 'semana') {
    const diaSemana = hoje.getDay();
    const inicio = new Date(hoje); inicio.setDate(hoje.getDate() - diaSemana);
    const fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
    return { dataInicio: iso(inicio), dataFim: iso(fim) };
  }
  if (periodo === 'mes') {
    const inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    return { dataInicio: iso(inicio), dataFim: iso(fim) };
  }
  return { dataInicio: null, dataFim: null };
}

function selecionarPeriodo(periodo, btn) {
  periodoAtivo = periodo;
  document.querySelectorAll('.periodo-btn').forEach(b => b.classList.remove('ativo'));
  if (btn) btn.classList.add('ativo');

  if (periodo !== 'custom') {
    const { dataInicio, dataFim } = calcularDatas(periodo);
    document.getElementById('dataInicio').value = dataInicio || '';
    document.getElementById('dataFim').value = dataFim || '';
  }
  carregar();
}

async function carregar() {
  if (!obterToken()) { mostrarTelaToken(); return; }
  document.getElementById('lista').innerHTML = '<div class="carregando">Carregando confirmações...</div>';

  const dataInicio = document.getElementById('dataInicio').value || null;
  const dataFim = document.getElementById('dataFim').value || null;

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ acao: 'listar', token: obterToken(), dataInicio, dataFim })
    });
    const data = await res.json();
    if (data && data.erro === 'nao_autorizado') {
      localStorage.removeItem(CHAVE_TOKEN);
      mostrarTelaToken();
      return;
    }
    todasConfirmacoes = data.confirmacoes || [];
    linhaAberta = null;
    renderizarContadores();
    renderizarLista();
  } catch (e) {
    document.getElementById('lista').innerHTML = `
      <div class="estado-vazio">
        <div class="icone">⚠️</div>
        <div class="titulo">Erro ao carregar</div>
      </div>`;
    mostrarToast('Erro ao carregar confirmações.', 'erro');
  }
}

function renderizarContadores() {
  const cont = document.getElementById('contadores');
  const filtros = document.getElementById('filtrosStatus');

  const contagens = {};
  ORDEM_STATUS.forEach(s => contagens[s] = 0);
  todasConfirmacoes.forEach(c => { if (contagens[c.status] !== undefined) contagens[c.status]++; });

  cont.innerHTML = ORDEM_STATUS.map(s => {
    const meta = STATUS_META[s];
    const ativo = statusAtivo === s ? ' ativo' : '';
    return `
      <div class="contador-card${ativo}" onclick="filtrarStatus('${s}')">
        <div class="contador-icone ${meta.classeIcone}">${meta.icone}</div>
        <div>
          <div class="contador-numero">${contagens[s]}</div>
          <div class="contador-label">${meta.label}</div>
        </div>
      </div>`;
  }).join('');

  filtros.innerHTML = `<button class="filtro-btn${statusAtivo === 'todos' ? ' ativo' : ''}" onclick="filtrarStatus('todos')">Todos (${todasConfirmacoes.length})</button>` +
    ORDEM_STATUS.map(s => {
      const meta = STATUS_META[s];
      const ativo = statusAtivo === s ? ' ativo' : '';
      return `<button class="filtro-btn${ativo}" onclick="filtrarStatus('${s}')">${meta.label} (${contagens[s]})</button>`;
    }).join('');
}

function filtrarStatus(status) {
  statusAtivo = status;
  linhaAberta = null;
  renderizarContadores();
  renderizarLista();
}

function normalizar(txt) {
  return (txt || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function parseDataBR(dataStr) {
  // espera DD/MM/AAAA -> Date, para permitir ordenar por data da consulta
  if (!dataStr) return null;
  const partes = dataStr.split('/');
  if (partes.length !== 3) return null;
  const [d, m, a] = partes;
  return new Date(`${a}-${m}-${d}T00:00:00`);
}

function alternarLinha(id) {
  linhaAberta = linhaAberta === id ? null : id;
  renderizarLista();
}

function renderizarLista() {
  const lista = document.getElementById('lista');
  const termoBusca = normalizar(document.getElementById('buscaInput').value);
  const ordenacao = document.getElementById('ordenacaoSelect').value;

  let filtradas = (statusAtivo === 'todos' ? todasConfirmacoes : todasConfirmacoes.filter(c => c.status === statusAtivo));

  if (termoBusca) {
    filtradas = filtradas.filter(c =>
      normalizar(c.nome).includes(termoBusca) ||
      normalizar(c.telefone).includes(termoBusca)
    );
  }

  filtradas = [...filtradas].sort((a, b) => {
    if (ordenacao === 'alfabetica') {
      return normalizar(a.nome).localeCompare(normalizar(b.nome));
    }
    if (ordenacao === 'data_consulta') {
      const da = parseDataBR(a.data), db = parseDataBR(b.data);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    }
    return new Date(b.created_at) - new Date(a.created_at);
  });

  if (filtradas.length === 0) {
    lista.innerHTML = `
      <div class="estado-vazio">
        <div class="icone">📭</div>
        <div class="titulo">Nenhuma confirmação encontrada nesse período/filtro</div>
      </div>`;
    return;
  }

  lista.innerHTML = filtradas.map((c, i) => {
    const meta = STATUS_META[c.status] || { label: c.status };
    const dataEnvio = c.created_at ? new Date(c.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
    const idLinha = String(c.id != null ? c.id : i);
    const aberta = linhaAberta === idLinha;
    return `
      <div class="linha status-${c.status}${aberta ? ' aberta' : ''}">
        <div class="linha-cabeca" onclick="alternarLinha('${idLinha}')">
          <div>
            <div class="linha-nome">${c.nome || 'Paciente não identificado'}</div>
            <div class="linha-nome-sub">${c.resumo ? c.resumo.slice(0, 60) + (c.resumo.length > 60 ? '…' : '') : ''}</div>
          </div>
          <div class="linha-telefone">${c.telefone || '—'}</div>
          <div class="linha-data">Consulta: ${c.data || '—'}</div>
          <div class="linha-badges">
            <span class="badge ${c.status}">${meta.label}</span>
            ${c.tipo_lembrete ? `<span class="badge-lembrete">${c.tipo_lembrete}</span>` : ''}
          </div>
          <div class="linha-seta">▶</div>
        </div>
        <div class="linha-corpo">
          <div class="linha-corpo-inner">
            <div class="campo-label">Telefone</div>
            <div class="campo-valor">${c.telefone || '—'}</div>
            <div class="campo-label">Enviado em</div>
            <div class="campo-valor">${dataEnvio}</div>
            ${c.resumo ? `<div class="campo-label">Agendamento</div><div class="campo-valor">${c.resumo}</div>` : ''}
            ${c.mensagem ? `<div class="linha-mensagem">${c.mensagem}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function mostrarToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visivel ' + (tipo || '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

window.addEventListener('DOMContentLoaded', function() {
  selecionarPeriodo('hoje', document.querySelector('.periodo-btn[data-periodo="hoje"]'));
  setInterval(carregar, 30000);
});
</script>
